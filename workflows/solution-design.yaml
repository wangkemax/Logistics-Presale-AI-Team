# 解决方案设计工作流

name: Solution Design Workflow
description: Logistics Architect Agent 专用方案设计子工作流

## 触发条件

CEO Agent 完成招标解析和知识库检索后，向 Logistics Architect Agent 下发任务指令。

## 输入清单

- 招标文件解析报告（Tender Requirement Extractor 输出）
- Knowledge Base 相关历史案例
- CEO Agent 调度指令
- 客户要求清单（SKU / SLA / 业务范围 / 特殊约束）

## 方案设计步骤

### Step 1：需求理解
- 梳理客户核心诉求（成本 / 效率 / 质量 / 灵活性）
- 识别季节性峰值特征
- 确认 SLA 关键指标
- 标记尚未明确的约束条件

### Step 2：网络布局设计
- 仓库位置选择逻辑
- 仓网层级结构（CDC / RDC / FDC）
- 覆盖半径与服务能力
- 与客户现有网络的协同或替代关系

### Step 3：运营流程设计
- 入库流程（收货 / 上架 / 质检）
- 在库管理（存储策略 / 盘点 / 损溢）
- 出库流程（拣货 / 打包 / 称重 / 出库）
- 逆向物流（退货 / 换货）

### Step 4：资源配置
- 人员配置（班次 / 岗位 / 招募周期）
- 设备选型（货架 / 搬运设备 / 输送线 / 自动化的程度）
- 系统需求（WMS / TMS / OMS）
- 包材与消耗品

### Step 5：KPI 设计
- 吞吐量指标（入库/出库票数）
- 时效指标（24h 履约率）
- 质量指标（准确率 / 损货率）
- 成本指标（单位操作成本）

### Step 6：亮点与差异化
- 相对竞争对手的核心优势
- 客户关心的增值服务
- 可展示的运营创新能力

## 输出格式

```yaml
[Summary]: 方案核心结论一到三句

[Structured Output]:
  - 方案模式: xxx
  - 网络布局: xxx
  - 流程设计: xxx
  - 资源配置: xxx
  - KPI 设计: xxx
  - 亮点与差异化: xxx
  - 可实施性评估: xxx

[Risks / Missing Info]:
  - 尚未确认的假设: xxx
  - 风险项: xxx
  - 需客户确认的前置项: xxx
```

## 禁止事项

- 不做成本数字测算
- 不写投标正文
- 不设计自动化脚本细节
- 不输出 PPT 或展示材料

## 输出流向

- → Cost Model Agent（提供资源用量和方案结构）
- → Tender Writer Agent（提供方案亮点和差异化）
- → Data Analyst Agent（提供 KPI 基线数据）
