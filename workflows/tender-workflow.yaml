# 投标工作流

name: Tender Workflow
description: 从招标文件到最终交付的完整 9 步执行链路

## 触发条件

用户上传招标文件（PDF/Word）或提供招标需求描述。

## 执行链路（强制顺序，不可乱序）

```
Step 1 → Tender Requirement Extractor
  输入：招标文件原文
  输出：十章节结构化招标文件解析

Step 2 → Knowledge Base Agent
  输入：招标项目背景 + 客户行业
  输出：相关历史案例 / 可复用模板 / 公司能力匹配

Step 3 → CEO Agent（制定调度计划）
  输入：① + ② 输出
  输出：任务分解计划 / 关键假设清单 / Agent 调度指令

Step 4 → Logistics Architect Agent
  输入：招标文件 + 知识库 + CEO 指令
  输出：方案框架 / 流程设计 / 资源配置 / 亮点 / 可实施性

Step 5 → Cost Model Agent
  输入：④ 方案 + 资源假设 + 单价参数
  输出：成本拆分 / 三档场景 / 报价建议 / 敏感性分析

Step 6 → Data Analyst Agent
  输入：原始数据 + 分析目标 + ④⑤上下文
  输出：关键发现 / 数据洞察 / 趋势判断 / 风险提示

Step 7 → Tender Writer Agent
  输入：招标响应要点 + ④方案 + ⑤成本 + ⑥分析
  输出：投标书九章节草稿 / 执行摘要 / 亮点 / 招标语言

Step 8 → Automation Agent
  输入：①-⑦所有输出
  输出：可复用模板 / 自动化路径 / 工具链接入 / 数据流设计

Step 9 → QA / Compliance Agent（终审）
  输入：①-⑧所有输出
  输出：合规检查 / 一致性检查 / 缺失项 / 改进建议 / 最终判定
```

## 质量门禁（每轮必须执行）

1. **一致性检查** — 方案 ↔ 成本 ↔ 服务范围是否对齐
2. **响应性检查** — 是否回答了招标文件所有关键点
3. **风险检查** — 假设是否已列出，是否需要人工复核
4. **表达检查** — 是否正式、结构清晰、无空话
5. **可执行性检查** — 方案能否落地，自动化能否复用

未通过 → 退回对应 Agent 修正 → 重新通过门禁 → 交付

## 输出交付物

- 招标文件解析报告
- 物流解决方案文档
- 成本模型与报价建议
- 数据分析报告
- 完整投标书
- 自动化沉淀方案
- QA 审查报告

## 适用场景

- 物流/仓储/供应链投标
- 客户需求建议书（RFP）响应
- 招标评分优化
